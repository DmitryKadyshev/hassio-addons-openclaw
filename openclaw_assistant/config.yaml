name: OpenClaw Assistant
version: "0.5.92"
slug: openclaw_assistant
description: Run OpenClaw Assistant (OpenClaw-compatible) as a Home Assistant add-on.
url: https://github.com/techartdev/OpenClawHomeAssistant
image: ghcr.io/dmitrykadyshev/openclawhomeassistant
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
hassio_api: false
homeassistant_api: false
host_network: true

ingress: true
ingress_port: 48099
panel_title: OpenClaw Assistant
panel_icon: mdi:robot
watchdog: tcp://[HOST]:48099
backup_exclude:
  - ".linuxbrew"
  - ".node_global"
  - ".npm"
  - ".cache"
  - "__pycache__"
  - "*.jsonl.lock"
map:
  - addon_config:rw
  - share:rw
  - media:rw
options:
  timezone: "Europe/Sofia"
  enable_terminal: true
  terminal_port: 7681
  gateway_public_url: ""
  homeassistant_token: ""
  http_proxy: ""
  router_ssh_host: ""
  router_ssh_user: ""
  router_ssh_key_path: "/data/keys/router_ssh"
  clean_session_locks_on_start: true
  clean_session_locks_on_exit: true
  persist_node_global: false
  persist_brew_tools: false
  gateway_mode: local
  gateway_remote_url: ""
  gateway_bind_mode: loopback
  gateway_port: 18789
  access_mode: custom
  gateway_auth_mode: token
  gateway_trusted_proxies: ""
  gateway_additional_allowed_origins: ""
  controlui_disable_device_auth: true
  enable_openai_api: false
  force_ipv4_dns: true
  nginx_log_level: minimal
  gateway_env_vars: []
  auto_configure_mcp: false
  resource_profile: auto
  ha_health_sensors: false
  ha_health_interval: 60
  ha_base_url: ""
  config_backup_keep: 10
schema:
  timezone: str
  enable_terminal: bool?
  terminal_port: int(1024,65535)?
  gateway_public_url: str?
  homeassistant_token: str?
  http_proxy: str
  router_ssh_host: str
  router_ssh_user: str
  router_ssh_key_path: str
  clean_session_locks_on_start: bool?
  clean_session_locks_on_exit: bool?
  persist_node_global: bool?
  persist_brew_tools: bool?
  gateway_mode: list(local|remote)?
  gateway_remote_url: str?
  gateway_bind_mode: list(loopback|lan|tailnet)?
  gateway_port: int(1,65535)?
  access_mode: list(custom|local_only|lan_https|lan_reverse_proxy|tailnet_https)?
  gateway_auth_mode: list(token|trusted-proxy)?
  gateway_trusted_proxies: str?
  gateway_additional_allowed_origins: str?
  controlui_disable_device_auth: bool?
  enable_openai_api: bool?
  force_ipv4_dns: bool?
  gateway_env_vars:
    - name: "match(^[A-Z_][A-Z0-9_]*$)"
      value: str
  nginx_log_level: list(full|minimal)?
  auto_configure_mcp: bool?
  resource_profile: list(auto|low|balanced|high)?
  ha_health_sensors: bool?
  ha_health_interval: int(15,3600)?
  ha_base_url: str?
  config_backup_keep: int(0,100)?
